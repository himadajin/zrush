name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: cargo build (release)
        run: cargo build --release
      - name: cargo test
        run: cargo test
      - name: zle driver
        run: zsh -f tests/zsh/driver.zsh "$(mktemp -d)"
      - name: zsh plan-decoder vectors
        run: zsh -f tests/zsh/vectors.zsh
      - name: zsh worker transport
        run: zsh -f tests/zsh/transport.zsh

  test-linux:
    strategy:
      fail-fast: false
      matrix:
        zsh-version: ["5.8.1", "5.9"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test suite in container (zsh ${{ matrix.zsh-version }})
        run: tests/docker/run.sh ${{ matrix.zsh-version }}
