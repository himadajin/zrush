[package]
name = "zrush"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
# CLI argument parsing (derive). Declarative parsing keeps subcommand,
# --help, and usage-error behavior robust at the process boundary.
clap = { version = "4.6", features = ["derive"] }
# Fuzzy (subsequence) matching for typo mode:
# - catches subsequence/prefix cases (dcs->docs, inte->internal)
# - does NOT catch transpositions/substitutions/insertions (gti->git);
#   those are covered by our own bounded edit-distance logic in matching.rs.
# Deps: memchr + unicode-segmentation only. No spawn-time impact measured.
nucleo-matcher = "0.3"
# Config parsing. default-features off drops the Display/serialization half;
# "parse" + "serde" is the minimal feature set that provides toml::Table.
# No proc macros (we walk Value manually for per-key fallback + warnings).
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
# Terminal display width for grid cell padding/truncation (layout.rs).
# Character-count offsets (spans, highlight ranges) stay separate from
# width (cli-protocol.md "オフセット規律") -- this crate is only consulted
# for the width side of that split.
unicode-width = "0.2"

[dev-dependencies]
# Property tests cover parser totality and render-plan wire invariants across
# generated byte inputs, complementing the byte-exact vector corpus.
proptest = "1"

[profile.release]
# Keep the installed CLI and per-shell worker small and fast.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
